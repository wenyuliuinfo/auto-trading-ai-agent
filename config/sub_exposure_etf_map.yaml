# config/sub_exposure_etf_map.yaml
#
# Hand-curated sub-exposure -> ETF ticker mapping for search_holdings()
# (SCREENER_SKILL.md, Step 2). No free API maps a sub-exposure keyword to
# relevant ETFs automatically — this file is the one piece of Screener
# configuration that has no data-source shortcut and must be maintained
# by a human as new themes are added.
#
# Sourced from: the 11 GICS Select Sector SPDR ETFs (State Street), plus
# major thematic ETF families (Global X, ARK, iShares, VanEck, First
# Trust, SPDR thematic/industry funds) current as of late July 2026.
# ETF holdings and even fund existence change over time — this file is a
# SEED, not a permanently-accurate source; validate tickers are still
# listed before relying on this in production, and expect to add/retire
# entries as funds launch, merge, or close.
#
# An unmapped sub-exposure is a known gap (see Hard Rule 3 in
# SCREENER_SKILL.md) — do not have an LLM guess a ticker to fill one in.

# --- Broad GICS sectors (11 Select Sector SPDRs) ---
